spring:
  datasource:
    url: jdbc:mysql://localhost:3306/flowforge_db?allowPublicKeyRetrieval=true&useSSL=false

    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect